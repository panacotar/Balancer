name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: bin/rails db:prepare
      - run: npm run build && npm run build:css
      - run: bin/rails zeitwerk:check
      - run: bin/rails test
      - run: bin/rails test:system
      - name: Deployment helper regression tests
        run: python3 -m unittest discover -s test/deployment -p '*_test.py' -v
      - name: Production asset compilation
        run: bin/rails assets:precompile
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-failures
          path: |
            tmp/screenshots
            log/test.log
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: bundle exec bundler-audit check --update
      - run: bundle exec brakeman --no-pager
      - run: npm audit --audit-level=low
  container:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build ARM64 production image
        run: docker build --pull -t balancer:ci .
      - name: Container lifecycle, security and recovery
        run: scripts/test-container.sh balancer:ci
