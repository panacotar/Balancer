- id: 1
  key: briiv
  name: The Briiv Air Filter
  project_name: Briiv circular living
  category: Others
  founder: Ines Costa
  description: Help prototype a plant-inspired air filter with replaceable natural materials.
  vision: Make everyday home appliances easier to repair and less dependent on disposable plastic.
  pitch: Fund a small pilot of a plant-inspired air filter with a reusable housing and replaceable natural filter materials. The team will compare material durability, document maintenance costs, and run workshops with local repair cafes before considering a wider launch.
  target: Apartment residents, repair cafes, and households exploring lower-waste living.
  investment_goal: 40000
  equity: 8
  funding_percent: 35
  started_days_ago: 8
  ends_in_days: 36

- id: 2
  key: ausair
  name: AusAir
  project_name: AusAir reusable essentials
  category: Clothing, accessories
  founder: Tiago Martins
  description: Back a reusable mask pilot focused on comfort, fit, and less packaging.
  vision: Give commuters practical reusable essentials with clear care instructions and less packaging.
