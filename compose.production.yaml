name: balancer

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt: [no-new-privileges:true]

services:
  web:
    <<: *defaults
    image: balancer:${GIT_SHA:?Set GIT_SHA in .env.production}
    build: .
    init: true
    env_file: .env.production
    environment:
      RAILS_ENV: production
      RAILS_MAX_THREADS: "3"
      BIND_HOST: 0.0.0.0
      PGHOST: db
      PGUSER: balancer
      PGDATABASE: balancer_production
      PGPORT: "5432"
    networks:
      edge:
        aliases: [balancer-web]
      database: {}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/rails/storage
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /rails/tmp:size=32m,uid=1000,gid=1000,mode=0700
      - /rails/log:size=32m,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 150
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", "http://127.0.0.1:3000/healthcheck"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s

  # Only started when scripts/setup-production.sh finds ports 80/443 free on
  # the host (Compose profile "caddy"). If something else already listens on
  # those ports, this service stays off and that listener reaches `web`
  # through the `edge` network instead. See doc/vps.md.
  caddy:
    <<: *defaults
    image: caddy:2-alpine
    profiles: [caddy]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    pids_limit: 50
    stop_grace_period: 15s

  db:
    <<: *defaults
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: balancer
      POSTGRES_PASSWORD: ${BALANCER_DATABASE_PASSWORD:?Set BALANCER_DATABASE_PASSWORD in .env.production}
      POSTGRES_DB: balancer_production
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    networks: [database]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=20]
    mem_limit: 384m
    shm_size: 128m
    pids_limit: 150
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U balancer -d balancer_production"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

networks:
  # Created by scripts/setup-production.sh. When Balancer runs its own
  # `caddy` service above, it joins this network. Otherwise, whatever reverse
  # proxy already owns ports 80/443 on the host joins it instead, to reach
  # `web` as `balancer-web`. Nothing in this file names another project.
  edge:
    external: true
    name: balancer-edge
  database:
    internal: true

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
